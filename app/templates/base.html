<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ business }}{% endblock %}</title>
  <style>
    :root { --green: #3d6b45; --ink: #222; --muted: #666; --line: #d9d4c7; --bg: #f7f4ec; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 8px; color: var(--green); }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    label .opt { font-weight: 400; color: var(--muted); }
    input[type=text], input[type=email], input[type=tel], input[type=password], textarea {
      width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }
    .checks { display: flex; flex-wrap: wrap; gap: 8px; }
    .checks label { font-weight: 400; margin: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
    .checks input { margin-right: 6px; }
    button { margin-top: 24px; width: 100%; padding: 14px; font-size: 17px; font-weight: 600; color: #fff; background: var(--green); border: 0; border-radius: 8px; cursor: pointer; }
    button.secondary { margin-top: 12px; color: var(--ink); background: #fff; border: 1px solid var(--line); font-weight: 400; }
    .when { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
    .errors { background: #fdecea; border: 1px solid #f5c2bd; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
    .errors li { margin: 2px 0; }
    .hp { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
