# /etc/nginx/sites-available/demo  (then symlink into sites-enabled, nginx -t, reload)
# Cloudflare terminates HTTPS for visitors. SSL mode "Full" works with the self-signed/snakeoil
# cert below; "Full (strict)" needs a Cloudflare Origin Certificate in its place.
server {
    listen 80;
    listen 443 ssl;
    server_name demo.howedigitalsystems.com;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
